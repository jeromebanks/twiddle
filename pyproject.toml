[project]
name = "twiddle"
version = "0.1.0"
description = "A terminal radio and gig-finder: every station at once, tonight's local shows, and a clay critter who eats static. Plays on your Mac, your headphones or your Sonos."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "requests>=2.34.2",
    "soco>=0.31.2",
    "textual>=8.2.8",
    "textual-image>=0.14.0",
]

[project.scripts]
twiddle = "twiddle.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
